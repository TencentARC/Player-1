profile: game-gym
game_id: 32_wordle

game_rules: |-
  You are playing Wordle, a word guessing game.
  - Guess the hidden five-letter word within six attempts.
  - Green letters are correct and correctly placed, yellow letters occur elsewhere, and gray letters are absent.
  - A valid guess is submitted automatically after its fifth letter is typed.

roles:
  player:
    description: |-
      You enter guesses and use the color feedback to refine them.
    controls:
      - Tap letter keys to type a five-letter word in order.
      - Tap backspace to remove the latest letter.
      - Tap enter if the game requests manual submission.
      - Wait for one game step when no input is needed.
    in_context_examples:
      control_v0_5:
        - name: start with common letters
          response: |-
            <think>
            I need a broad opening guess with common letters, so I should type CRANE to learn which letters belong and where they go.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_tap>
            ["c","r","a","n","e"]
            </parameter>
            </function>
            </tool_call>
        - name: test new letters
          response: |-
            <think>
            The previous feedback ruled out C, R, and N but kept A and E useful, so I should type PLATE to test new letters and positions.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_tap>
            ["p","l","a","t","e"]
            </parameter>
            </function>
            </tool_call>
