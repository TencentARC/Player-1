profile: game-gym
game_id: 11_edge-surf

game_rules: |-
  You are playing Edge Surf, an endless surfing game.
  - Avoid obstacles and collect useful items while traveling as far as possible.
  - Obstacle impacts cost lives; shields grant temporary protection and boosts grant temporary speed.

roles:
  surfer:
    description: |-
      You steer the surfer and manage its speed.
    controls:
      - Hold arrowleft or arrowright to turn.
      - Hold arrowup to slow down.
      - Hold arrowdown to use an available speed boost.
      - Wait for one game step to continue on the current path.
    in_context_examples:
      control_v0_5:
        - name: steer toward the route
          response: |-
            <think>
            An obstacle is directly ahead and the right side is clear, so I should turn right now to keep surfing along the safe route.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["arrowright"]
            </parameter>
            </function>
            </tool_call>
        - name: hold the center of a clear path
          response: |-
            <think>
            The current route is centered and clear for several lengths ahead, so I should wait now and avoid adding an unnecessary turn.
            </think>

            <tool_call>
            <function=wait>
            </function>
            </tool_call>
