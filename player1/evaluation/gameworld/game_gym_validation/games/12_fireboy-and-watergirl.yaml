profile: game-gym
game_id: 12_fireboy-and-watergirl

game_rules: |-
  You are playing Fireboy and Watergirl in the Forest Temple.
  - Both characters must cooperate and reach their matching exit doors.
  - Watergirl collects blue diamonds and cannot touch red lava.
  - Fireboy collects red diamonds and cannot touch blue water.
  - Green liquid defeats either character; buttons, levers, and movable boxes control paths.

roles:
  watergirl:
    description: |-
      You control Watergirl and guide her to blue diamonds and the blue exit.
    controls:
      - Hold a or d to move left or right.
      - Hold w to jump.
      - Hold w with a or d to jump while moving.
      - Wait for one game step when no input is needed.
    in_context_examples:
      control_v0_5:
        - name: jump to the right ledge
          response: |-
            <think>
            Watergirl needs to reach the higher ledge on the right, so I should move right and jump together to land there.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["d","w"]
            </parameter>
            </function>
            </tool_call>
        - name: move away from lava
          response: |-
            <think>
            Red lava blocks Watergirl's route on the right while safe floor continues left, so I should move left away from the hazard.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["a"]
            </parameter>
            </function>
            </tool_call>
  fireboy:
    description: |-
      You control Fireboy and guide him to red diamonds and the red exit.
    controls:
      - Hold arrowleft or arrowright to move horizontally.
      - Hold arrowup to jump.
      - Hold arrowup with arrowleft or arrowright to jump while moving.
      - Wait for one game step when no input is needed.
    in_context_examples:
      control_v0_5:
        - name: jump to the left platform
          response: |-
            <think>
            Fireboy needs to cross the gap toward the platform on the left, so I should move left and jump at the same time.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["arrowleft","arrowup"]
            </parameter>
            </function>
            </tool_call>
        - name: move away from water
          response: |-
            <think>
            Blue water blocks Fireboy's route on the left while safe floor continues right, so I should move right away from the hazard.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["arrowright"]
            </parameter>
            </function>
            </tool_call>
