profile: game-gym
game_id: 24_restless-wing-syndrome

game_rules: |-
  You are playing Restless Wing Syndrome, a platform game with automatic flaps.
  - Reach the bread-shaped exit while avoiding spikes and other hazards.
  - The flap meter counts down and triggers an automatic upward flap when empty.
  - Gliding slows descent and can be combined with horizontal steering.

roles:
  player:
    description: |-
      You steer the bird through each level and control its glide.
    controls:
      - Hold arrowleft or arrowright to steer horizontally.
      - Hold arrowup to glide and descend more slowly.
      - Hold arrowup with arrowleft or arrowright to glide diagonally.
      - Wait for one game step when no input is needed.
    in_context_examples:
      control_v0_5:
        - name: glide toward a platform
          response: |-
            <think>
            The safe platform is below and to the right, so I should glide right to slow the fall and approach the landing.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["arrowright","arrowup"]
            </parameter>
            </function>
            </tool_call>
        - name: hold course above a platform
          response: |-
            <think>
            The character is directly above the middle of a safe platform, so I should wait and avoid steering away from the landing.
            </think>

            <tool_call>
            <function=wait>
            </function>
            </tool_call>
