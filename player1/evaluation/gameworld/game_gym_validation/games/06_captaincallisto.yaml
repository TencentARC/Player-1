profile: game-gym
game_id: 06_captaincallisto

game_rules: |-
  You are playing Captain Callisto, a platform adventure game.
  - Reach each area's exit and collect coins along the way.
  - Fuel enables the jetpack for upward flight.
  - Landing on enemies defeats them; other enemy contact or falling causes a respawn.

roles:
  explorer:
    description: |-
      You control Captain Callisto.
    controls:
      - Hold arrowleft, arrowright, a, or d to move horizontally.
      - Hold arrowup, arrowdown, w, or s to climb or move vertically.
      - Hold space to jump and shift to use collected jetpack fuel.
      - Tap r to restart the area.
      - Wait for one game step when no input is needed.
    in_context_examples:
      control_v0_5:
        - name: jump across a gap
          response: |-
            <think>
            The next ledge is ahead and above, so I should move right and jump together to cross the gap and gain height.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["arrowright","space"]
            </parameter>
            </function>
            </tool_call>
        - name: climb through a passage
          response: |-
            <think>
            A climbable passage continues directly above me, so I should move upward through it instead of jumping toward the distant ledge.
            </think>

            <tool_call>
            <function=key_control>
            <parameter=key_hold>
            ["arrowup"]
            </parameter>
            </function>
            </tool_call>
