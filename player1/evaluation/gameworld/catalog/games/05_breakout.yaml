game_rules: |
  You are playing Breakout, a classic brick-breaking game.

  ## Game Objective
  - Break all the bricks to complete each level. Each brick broken adds to your score.

  ## Game Rules
  - Use the paddle to bounce the ball upward.
  - Break bricks by hitting them with the ball.
  - Don't let the ball fall past the paddle.


game_roles:
  - name: player
    prompt:
      role_section: |
        You control the paddle.
        Move left and right to keep the ball in play and break bricks.
      computer_use_controls_section: |
        ACTION SPACE (ONLY LEGAL ACTIONS):
        - Wait briefly for fine timing, or longer while the ball is safely away from the paddle.
        - Hold Arrow Left/Right briefly for a small correction, or longer for a large adjustment.
    computer_use_controls:
      allowed_keys: ["ArrowLeft", "ArrowRight"]
      allow_clicks: false
      hold_duration: 0.1
    semantic_controls:
      - id: wait
        description: Stay still briefly for fine timing.
        binding:
          action: wait
          duration: 0.1
      - id: wait_long
        description: Stay still longer while the ball is safely away from the paddle.
        binding:
          action: wait
          duration: 0.2
      - id: move_left
        description: Move the paddle left briefly for a small correction.
        binding:
          action: press_key
          key: "ArrowLeft"
          duration: 0.1
      - id: move_left_long
        description: Move the paddle left longer when a large adjustment is needed.
        binding:
          action: press_key
          key: "ArrowLeft"
          duration: 0.2
      - id: move_right
        description: Move the paddle right briefly for a small correction.
        binding:
          action: press_key
          key: "ArrowRight"
          duration: 0.1
      - id: move_right_long
        description: Move the paddle right longer when a large adjustment is needed.
        binding:
          action: press_key
          key: "ArrowRight"
          duration: 0.2
