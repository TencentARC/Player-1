task_prompt: |
  Operate the store efficiently by collecting and restocking bananas and corn until you earn 130 coins.

evaluator_config:
  objective:
    reach:
      game_state.money_total_earned: 130
  metrics_fields:
    - gameTimeMs
    - game_state.score
    - game_state.money
    - metrics.primary_score
    - game_state.money_scan_status
