task_prompt: |
  Run the shop by collecting bananas and corn, restocking them, and earning 30 coins.

evaluator_config:
  objective:
    reach:
      game_state.money_total_earned: 30
  metrics_fields:
    - gameTimeMs
    - game_state.score
    - game_state.money
    - metrics.primary_score
    - game_state.money_scan_status
