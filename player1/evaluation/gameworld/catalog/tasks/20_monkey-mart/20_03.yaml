task_prompt: |
  Collect and restock bananas and corn until you have earned 75 coins.

evaluator_config:
  objective:
    reach:
      game_state.money_total_earned: 75
  metrics_fields:
    - gameTimeMs
    - game_state.score
    - game_state.money
    - metrics.primary_score
    - game_state.money_scan_status
