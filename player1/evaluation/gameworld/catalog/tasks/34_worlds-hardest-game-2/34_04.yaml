game_url_suffix: "?level=2"

task_prompt: |
  On level 2, collect at least 1 coin.

evaluator_config:
  objective:
    reach:
      metrics.coins: 1
    require:
      game_state.level: 2
  metrics_fields:
    - game_state.completion_progress
    - metrics.checkpoints_passed
    - metrics.deaths
    - metrics.distance_to_goal
    - metrics.player_alive
