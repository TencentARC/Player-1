game_url_suffix: "?level=2"

task_prompt: |
  Play level 2 and come away with at least 2 coins.

evaluator_config:
  objective:
    reach:
      metrics.coins: 2
    require:
      game_state.level: 2
  metrics_fields:
    - game_state.completion_progress
    - metrics.checkpoints_passed
    - metrics.deaths
    - metrics.distance_to_goal
    - metrics.player_alive
