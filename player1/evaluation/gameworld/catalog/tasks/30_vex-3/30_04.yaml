game_url_suffix: "?level=1"

task_prompt: |
  Pass at least 4 checkpoints in one run.

evaluator_config:
  objective:
    reach:
      metrics.checkpoints_passed: 4
  metrics_fields:
    - game_state.completion_progress
    - metrics.checkpoints_total
    - metrics.deaths
    - metrics.distance_to_goal
    - metrics.total_levels
