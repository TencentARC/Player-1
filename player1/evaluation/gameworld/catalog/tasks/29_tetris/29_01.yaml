task_prompt: |
  Score at least 200 points while keeping the board playable.

evaluator_config:
  objective:
    reach:
      game_state.score: 200
  metrics_fields:
    - game_state.level
    - game_state.completion_progress
    - metrics.lines_remaining
    - metrics.lines_target
    - metrics.topped_out
    - metrics.board_playable
