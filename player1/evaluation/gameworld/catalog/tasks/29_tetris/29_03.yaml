task_prompt: |
  Reach 500 points or more while leaving room for new pieces.

evaluator_config:
  objective:
    reach:
      game_state.score: 500
  metrics_fields:
    - game_state.level
    - game_state.completion_progress
    - metrics.lines_remaining
    - metrics.lines_target
    - metrics.topped_out
    - metrics.board_playable
