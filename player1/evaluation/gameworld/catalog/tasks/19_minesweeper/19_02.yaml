task_prompt: |
  Reveal at least 63 safe cells without triggering a mine.
  Use clue numbers to identify safer openings near board edges.

evaluator_config:
  objective:
    reach:
      metrics.revealed_safe_cells: 63
  metrics_fields:
    - game_state.score
    - game_state.completion_progress
    - game_state.level
    - metrics.primary_score
    - metrics.total_safe_cells
    - metrics.correct_flags
    - metrics.total_mines
    - metrics.remaining_mines
