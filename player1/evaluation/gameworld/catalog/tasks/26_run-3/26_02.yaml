game_url_suffix: "?level=infinite"

task_prompt: |
  Start the run.
  Reach at least 150 distance without falling.

evaluator_config:
  objective:
    reach:
      metrics.distance: 150
  metrics_fields:
    - metrics.primary_score
    - game_state.level
    - metrics.deaths
    - metrics.coins
    - metrics.stars
