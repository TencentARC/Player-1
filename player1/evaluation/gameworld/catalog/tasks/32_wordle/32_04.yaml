game_url_suffix: "#infinite/4"

task_prompt: |
  Finish the round with every letter correct and in the right place.


evaluator_config:
  objective:
    reach:
      metrics.letters_correct: 5
    require:
      metrics.word_number: 4
  metrics_fields:
    - metrics.attempts
    - game_state.completion_progress
    - metrics.guesses_remaining
    - metrics.letters_present
    - metrics.letters_absent
