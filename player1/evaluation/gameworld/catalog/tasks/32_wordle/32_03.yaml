game_url_suffix: "#infinite/3"

task_prompt: |
  Reach 5 correctly placed letters in historical round 3.


evaluator_config:
  objective:
    reach:
      metrics.letters_correct: 5
    require:
      metrics.word_number: 3
  metrics_fields:
    - metrics.attempts
    - game_state.completion_progress
    - metrics.guesses_remaining
    - metrics.letters_present
    - metrics.letters_absent
