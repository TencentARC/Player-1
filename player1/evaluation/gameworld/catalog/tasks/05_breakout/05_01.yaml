game_url_suffix: "?level=1"

task_prompt: |
  Clear the board to reach 100% progress in this level.

evaluator_config:
  objective:
    reach:
      game_state.completion_progress: 1
  metrics_fields:
    - game_state.score
    - game_state.level
    - metrics.lives
    - metrics.bricks_remaining
    - metrics.bricks_total
