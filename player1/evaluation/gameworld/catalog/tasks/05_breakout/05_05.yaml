game_url_suffix: "?level=5"

task_prompt: |
  Finish the level by eliminating all bricks on screen.

evaluator_config:
  objective:
    reach:
      game_state.completion_progress: 1
  metrics_fields:
    - game_state.score
    - game_state.level
    - metrics.lives
    - metrics.bricks_remaining
    - metrics.bricks_total
