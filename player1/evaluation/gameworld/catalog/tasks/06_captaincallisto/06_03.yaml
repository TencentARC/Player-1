game_url_suffix: "?level=3"

task_prompt: |
  Pick up all 7 coins in a single run.

evaluator_config:
  objective:
    reach:
      metrics.coins: 7
  metrics_fields:
    - game_state.score
    - game_state.completion_progress
    - game_state.player
    - metrics.coins_total
    - metrics.lives
    - metrics.deaths
    - metrics.distance_to_goal
