game_url_suffix: "?level=5"

task_prompt: |
  Collect all 12 coins in level 5.

evaluator_config:
  objective:
    reach:
      metrics.coins: 12
  metrics_fields:
    - game_state.score
    - game_state.completion_progress
    - game_state.player
    - metrics.coins_total
    - metrics.lives
    - metrics.deaths
    - metrics.distance_to_goal
