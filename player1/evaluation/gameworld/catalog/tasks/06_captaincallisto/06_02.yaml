game_url_suffix: "?level=2"

task_prompt: |
  Collect every coin available in this level.

evaluator_config:
  objective:
    reach:
      metrics.coins: 8
  metrics_fields:
    - game_state.score
    - game_state.completion_progress
    - game_state.player
    - metrics.coins_total
    - metrics.lives
    - metrics.deaths
    - metrics.distance_to_goal
