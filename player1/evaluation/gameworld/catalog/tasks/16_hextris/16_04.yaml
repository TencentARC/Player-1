game_url_suffix: "?level=4"


task_prompt: |
  Reach at least 1250 points while keeping blocks inside the outer boundary.
  Keep stacks low on all six sides and rotate early to clear matching colors.

evaluator_config:
  objective:
    reach:
      game_state.score: 1250
  metrics_fields:
    - game_state.level
    - game_state.completion_progress
    - game_state.environment.settled_blocks
    - game_state.environment.highest_column_height
    - game_state.environment.active_blocks
    - metrics.score
    - metrics.distance
    - metrics.best_score
    - metrics.difficulty
    - metrics.topped_out
