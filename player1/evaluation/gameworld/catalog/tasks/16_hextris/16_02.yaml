game_url_suffix: "?level=2"


task_prompt: |
  Keep stacks low on all six sides, rotate to match colors, and reach at least 750 points.
  Keep blocks inside the outer boundary.

evaluator_config:
  objective:
    reach:
      game_state.score: 750
  metrics_fields:
    - game_state.level
    - game_state.completion_progress
    - game_state.environment.settled_blocks
    - game_state.environment.highest_column_height
    - game_state.environment.active_blocks
    - metrics.score
    - metrics.distance
    - metrics.best_score
    - metrics.difficulty
    - metrics.topped_out
