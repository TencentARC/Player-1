game_url_suffix: "?level=1"

task_prompt: |
  Reach at least 500 points while keeping blocks inside the outer boundary.
  Rotate in time to match colors; avoid risky last-second turns.

evaluator_config:
  objective:
    reach:
      game_state.score: 500
  metrics_fields:
    - game_state.level
    - game_state.completion_progress
    - game_state.environment.settled_blocks
    - game_state.environment.highest_column_height
    - game_state.environment.active_blocks
    - metrics.score
    - metrics.distance
    - metrics.best_score
    - metrics.difficulty
    - metrics.topped_out
