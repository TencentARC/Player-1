game_url_suffix: "?level=1"

task_prompt: |
  Clear the opening section and reach at least 50 points.
  Time each jump to clear spikes without touching their tips or sides.

evaluator_config:
  objective:
    reach:
      game_state.score: 50
  metrics_fields:
    - gameTimeMs
    - game_state.completion_progress
    - metrics.distance
    - metrics.points
    - metrics.best_score
    - metrics.deaths
    - game_state.mode
    - game_state.player_die
