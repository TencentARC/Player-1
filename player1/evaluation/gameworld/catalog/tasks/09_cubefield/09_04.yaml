task_prompt: |
  Handle denser, faster traffic with consistent lane changes and score at least 60000 in a single run.

evaluator_config:
  objective:
    reach:
      game_state.score: 60000
  metrics_fields:
    - game_state.level
    - gameTimeMs
    - metrics.distance
    - metrics.speed_forward
    - metrics.speed_side
    - metrics.cubes_alive
    - metrics.high_score
