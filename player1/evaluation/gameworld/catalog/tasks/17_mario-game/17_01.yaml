task_prompt: |
  Reach at least 200 points in this stage.

evaluator_config:
  objective:
    reach:
      metrics.score_earned: 200
  metrics_fields:
    - game_state.completion_progress
    - game_state.score
    - game_state.level
    - metrics.coins
    - metrics.lives
    - metrics.time_left_s
    - metrics.level_progress_percent
