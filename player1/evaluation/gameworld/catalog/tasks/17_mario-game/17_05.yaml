task_prompt: |
  Reach at least 4000 points before the game ends.

evaluator_config:
  objective:
    reach:
      metrics.score_earned: 4000
  metrics_fields:
    - game_state.completion_progress
    - game_state.score
    - game_state.level
    - metrics.coins
    - metrics.lives
    - metrics.time_left_s
    - metrics.level_progress_percent
