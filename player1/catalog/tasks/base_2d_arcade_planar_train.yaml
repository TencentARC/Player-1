task_id: "base_2d_arcade_planar_train"
game_id: base_2d_arcade_planar
game_url_suffix: "?autostart=1&difficulty=1.0&rand_init_pos=1&fullscreen=1"
evaluator_id: game_api_metric
training_reward_field: metrics.primary_score
training_reward_scale: 3
max_steps: 100
task_target_score_field: 100
continue_on_fail: false

task_prompt: |
  Collect coins.

evaluator_config:
  terminal_status: fail
  score_field: metrics.primary_score
  end_field: terminal.isTerminal
  metrics_fields:
    - metrics.primary_score
    - metrics.primary_positive_score
    - metrics.primary_penalty_score
    - metrics.env_reward_step
    - metrics.env_reward_episode
    - metrics.coins_collected
    - metrics.items_active
    - metrics.obstacles_active
    - metrics.difficulty
    - metrics.obstacle_spawn_probability
    - metrics.step_count
    - metrics.rand_init_pos
    - game_state.score
    - game_state.environment.difficulty
    - game_state.environment.obstacle_spawn_probability
    - game_state.environment.rand_init_pos
    - game_state.environment.perturb
    - terminal.outcome
    - terminal.isTerminal
