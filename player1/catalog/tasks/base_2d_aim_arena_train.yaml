task_id: "base_2d_aim_arena_train"
game_id: base_2d_aim_arena
game_url_suffix: "?autostart=1&difficulty=1&fullscreen=1"
evaluator_id: game_api_metric
training_reward_field: metrics.primary_score
training_reward_scale: 2
max_steps: 100
task_target_score_field: 100
continue_on_fail: false

task_prompt: |
  Eliminate enemies.

evaluator_config:
  terminal_status: fail
  score_field: metrics.primary_score
  end_field: terminal.isTerminal
  metrics_fields:
    - metrics.primary_score
    - metrics.primary_positive_score
    - metrics.primary_penalty_score
    - metrics.env_reward_step
    - metrics.env_reward_episode
    - metrics.kills
    - metrics.active_enemies
    - metrics.enemies_spawned
    - metrics.shots
    - metrics.hits
    - metrics.misses
    - metrics.blocked_shots
    - metrics.accuracy
    - metrics.health
    - metrics.max_health
    - metrics.health_unlimited
    - metrics.damage_taken
    - metrics.deaths
    - metrics.obstacle_count
    - metrics.best_primary_score
    - metrics.step_count
    - game_state.environment.difficulty
    - game_state.environment.perturb_active
    - terminal.outcome
    - terminal.reason
    - terminal.isTerminal
