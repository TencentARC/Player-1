game_name: gw_34_worlds-hardest-game-2_player
game_rules: 'You are playing World''s Hardest Game 2, a precision maze and dodge game.

  - Guide the red square to collect every item and then reach the green exit zone.

  - Blue enemies move in fixed cycles and defeat the square on contact.

  - Observe each cycle and cross exposed paths during safe openings.'
role_control:
  role_control_block: 'Role:

    You control the red square through the maze.

    Controls:

    - Hold arrowup, arrowdown, arrowleft, or arrowright to move.

    - Hold one vertical and one horizontal key together to move diagonally.

    - Wait for one game step when no input is needed.'
  game_controls:
    duration_ms: 100
    keys:
    - ArrowDown
    - ArrowLeft
    - ArrowRight
    - ArrowUp
    mouse_move: true
    mouse_click: []
    mouse_hold: []
in_context_examples:
  original_player1_control: &id001
  - name: cross during a safe opening
    response: '<think>

      The route toward the next item is open below and to the left, so I should move
      diagonally through the safe gap now.

      </think>


      <tool_call>

      <function=key_control>

      <parameter=key_hold>

      ["arrowdown","arrowleft"]

      </parameter>

      </function>

      </tool_call>'
  - name: wait for an enemy cycle
    response: '<think>

      A moving enemy currently blocks the opening toward the next item, so I should
      wait until it passes instead of entering its path now.

      </think>


      <tool_call>

      <function=wait>

      </function>

      </tool_call>'
  basic_player1_control: *id001
