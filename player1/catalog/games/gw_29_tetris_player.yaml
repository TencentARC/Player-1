game_name: gw_29_tetris_player
game_rules: 'You are playing Tetris, a falling block puzzle game.

  - Complete horizontal lines to clear them and score.

  - Move and rotate each falling piece to keep the stack low and leave usable spaces.

  - The game ends when a new piece can no longer enter the board.'
role_control:
  role_control_block: 'Role:

    You control the active falling piece and the held piece.

    Controls:

    - Tap arrowleft or arrowright to move the active piece.

    - Tap x to rotate clockwise or z to rotate counterclockwise.

    - Hold arrowdown to fall faster; tap space to drop straight to the bottom.

    - Tap c to swap the active and held pieces.

    - Wait for one game step when no input is needed.'
  game_controls:
    duration_ms: 100
    keys:
    - ArrowDown
    - ArrowLeft
    - ArrowRight
    - Space
    - c
    - x
    - z
    mouse_move: true
    mouse_click: []
    mouse_hold: []
in_context_examples:
  original_player1_control: &id001
  - name: drop an aligned piece
    response: '<think>

      The active piece is aligned with the open space at the bottom, so I should drop
      it straight to the bottom immediately.

      </think>


      <tool_call>

      <function=key_control>

      <parameter=key_tap>

      ["space"]

      </parameter>

      </function>

      </tool_call>'
  - name: rotate toward an open space
    response: '<think>

      The active piece has the wrong orientation for the open space below, so I should
      rotate it clockwise before choosing its final column.

      </think>


      <tool_call>

      <function=key_control>

      <parameter=key_tap>

      ["x"]

      </parameter>

      </function>

      </tool_call>'
  basic_player1_control: *id001
