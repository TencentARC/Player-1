game_name: base_3d_combat_arena

game_rules: |-
  You are playing 3D Combat Arena, an endless first-person combat game.
  Rules:
  - Move and aim while fighting continuously respawning enemies.
  - Your bullets are visible and take time to reach enemies, so aim ahead of enemies moving sideways.
  - Solid cover blocks bullets and movement at the same height.

role_control:
  role_control_block: |-
    Role:
    You control a first-person combatant.
    Controls:
    - Move with w=forward, s=backward, a=left, d=right; movement keys may be combined.
    Move the pointer or camera with dx and dy in [-1000, 1000]
    dx=1000 represents one full visible game width, and dy=1000 represents one full visible game height.
    Positive dx moves right, negative dx moves left, positive dy moves down, and negative dy moves up.
    dx and dy set the mouse movement amount.
    - Left-click to fire.
    - Press e to reload.
    - Press space to jump.
    - Wait for one game step when no input is needed.
  game_controls:
    duration_ms: 200
    keys: [w, s, a, d, e, space]
    mouse_move: true
    mouse_click: [left]

in_context_examples:
  original_player1_control:
    - name: move, aim ahead, and fire
      response: |-
        <think>
        The enemy is moving right. I should move left, aim a little ahead of it to the right, and fire in the same game step.
        </think>

        <tool_call>
        <function=mouse_control>
        <parameter=mouse_move>
        {"mode":"relative","dx":180,"dy":0}
        </parameter>
        <parameter=mouse_click>
        left
        </parameter>
        </function>
        </tool_call>
        <tool_call>
        <function=key_control>
        <parameter=key_hold>
        ["a"]
        </parameter>
        </function>
        </tool_call>

  basic_player1_control:
    - name: turn the view right
      response: |-
        <think>
        The arena extends beyond the right edge of my current view. I should move the mouse a little right to see more of that side.
        </think>

        <tool_call>
        <function=mouse_control>
        <parameter=mouse_move>
        {"mode":"relative","dx":100,"dy":0}
        </parameter>
        </function>
        </tool_call>
