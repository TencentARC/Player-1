game_name: gw_03_astray_player
game_rules: 'You are playing Astray, a maze navigation game.

  - Guide the ball through open corridors to the exit.

  - The exit is usually near the far upper-right corner.'
role_control:
  role_control_block: 'Role:

    You control the ball in the maze.

    Controls:

    - Hold arrowup, arrowdown, arrowleft, or arrowright to move through the maze.

    - Wait for one game step when no input is needed.'
  game_controls:
    duration_ms: 100
    keys:
    - ArrowDown
    - ArrowLeft
    - ArrowRight
    - ArrowUp
    mouse_move: true
    mouse_click: []
    mouse_hold: []
in_context_examples:
  original_player1_control: &id001
  - name: roll toward the right
    response: '<think>

      The corridor ahead is open to the right, so I should move right toward the next
      turn without touching either wall on the way.

      </think>


      <tool_call>

      <function=key_control>

      <parameter=key_hold>

      ["arrowright"]

      </parameter>

      </function>

      </tool_call>'
  - name: roll toward the top
    response: '<think>

      The right passage ends at a wall while the route upward is clear, so I should
      move up through the open corridor.

      </think>


      <tool_call>

      <function=key_control>

      <parameter=key_hold>

      ["arrowup"]

      </parameter>

      </function>

      </tool_call>'
  basic_player1_control: *id001
