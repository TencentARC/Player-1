game_name: gw_05_breakout_player
game_rules: 'You are playing Breakout, a brick-breaking game.

  - Keep the ball in play by bouncing it with the paddle.

  - Ball impacts break bricks and increase the score.

  - Letting the ball pass below the paddle loses it.'
role_control:
  role_control_block: 'Role:

    You control the paddle at the bottom of the board.

    Controls:

    - Hold arrowleft or arrowright to move the paddle.

    - Wait for one game step when the paddle is already aligned.'
  game_controls:
    duration_ms: 100
    keys:
    - ArrowLeft
    - ArrowRight
    mouse_move: true
    mouse_click: []
    mouse_hold: []
in_context_examples:
  original_player1_control: &id001
  - name: follow the ball
    response: '<think>

      The falling ball is to the right of the paddle, so I should move right to get
      underneath its path before impact.

      </think>


      <tool_call>

      <function=key_control>

      <parameter=key_hold>

      ["arrowright"]

      </parameter>

      </function>

      </tool_call>'
  - name: hold a good paddle position
    response: '<think>

      The paddle is already centered directly beneath the falling ball, so I should
      wait and preserve the alignment until the ball arrives.

      </think>


      <tool_call>

      <function=wait>

      </function>

      </tool_call>'
  basic_player1_control: *id001
