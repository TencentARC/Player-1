game_name: vizdoom_health_gathering_supreme
width: 640
height: 480

game_rules: |-
  You are playing ViZDoom Health Gathering Supreme in a complex damaging maze.
  - Survive as long as possible while the floor continuously drains health.
  - White-and-green medical cases with a white cross restore health; small green bottles are poison and reduce health, so avoid them.
  - Search through openings and change direction when a route has no reachable medkit.
  - Episode reward increases for every moment you stay alive.

role_control:
  role_control_block: |-
    Role:
    You control the ViZDoom player searching the maze for medkits.
    Controls:
    - Hold w to move forward.
    - Hold a or d to turn left or right.
    Turn the camera horizontally with dx in [-1000, 1000], and always set dy=0.

    dx=1000 represents one full visible game width.
    Positive dx turns right, and negative dx turns left.

    Larger dx values do not make you turn faster.
    - Wait for one game step when no input is needed.
  game_controls:
    duration_ms: 57
    keys: [w, a, d]
    mouse_move: true
    mouse_click: []
    mouse_hold: []

in_context_examples:
  player1_control:
    - name: search the next area
      response: |-
        <think>
        No medkit is visible in this room, but an open passage is ahead and left. I should turn toward it and keep moving to search the next area.
        </think>

        <tool_call>
        <function=mouse_control>
        <parameter=mouse_move>
        {"mode":"relative","dx":-100,"dy":0}
        </parameter>
        </function>
        </tool_call>
        <tool_call>
        <function=key_control>
        <parameter=key_hold>
        ["w"]
        </parameter>
        </function>
        </tool_call>
