game_name: base_3d_navigate_chase

game_rules: |-
  You are playing 3D Navigate Chase, viewed from behind your character.
  - Move around walls and pillars that can hide the moving target.
  - Chase and reach the target as it roams behind cover.

role_control:
  role_control_block: |-
    Role:
    You control a third-person character and camera.
    Controls:
    - Move with w=forward, s=backward, a=left, d=right.
    Move the pointer or camera with dx and dy in [-1000, 1000]
    dx=1000 represents one full visible game width, and dy=1000 represents one full visible game height.
    Positive dx moves right, negative dx moves left, positive dy moves down, and negative dy moves up.
    dx and dy set the mouse movement amount.
    - Wait for one game step when no input is needed.
  game_controls:
    duration_ms: 200
    keys: [w, a, s, d]
    mouse_move: true

in_context_examples:
  original_player1_control:
    - name: chase a moving target
      response: |-
        <think>
        The moving target is ahead and to the right. I should hold W and steer right at the same time to move forward while steering toward it.
        </think>

        <tool_call>
        <function=mouse_control>
        <parameter=mouse_move>
        {"mode":"relative","dx":150,"dy":0}
        </parameter>
        </function>
        </tool_call>
        <tool_call>
        <function=key_control>
        <parameter=key_hold>
        ["w"]
        </parameter>
        </function>
        </tool_call>

  basic_player1_control:
    - name: turn the view right
      response: |-
        <think>
        The character is facing down a passage with a wall visible on the right. I should move the mouse right to look toward that side of the passage.
        </think>

        <tool_call>
        <function=mouse_control>
        <parameter=mouse_move>
        {"mode":"relative","dx":100,"dy":0}
        </parameter>
        </function>
        </tool_call>
